[romhack-waf-signature]
search = index=romhack sourcetype=romhack:waf managed_match=true action!=BLOCK | dedup event_id | stats count values(path) as paths by run_id src_ip | where count >= 5 | eval scenario="waf-signature", event_id=sha256(run_id.src_ip.scenario)
