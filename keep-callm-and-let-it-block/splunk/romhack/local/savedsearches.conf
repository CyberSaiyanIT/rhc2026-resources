# Detections run every minute and POST each match to the workshop alert endpoint,
# which forwards it to your n8n webhook.

[romhack-failed-login]
search = index=romhack sourcetype=romhack:web status=401 | dedup event_id | stats count values(path) as paths by run_id src_ip | where count >= 5 | eval scenario="failed-login", event_id=sha256(run_id.src_ip.scenario)
enableSched = 1
cron_schedule = * * * * *
dispatch.earliest_time = -3m
dispatch.latest_time = now
alert.track = true
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.suppress = 0
action.webhook = 1
action.webhook.param.url = http://workshop:8000/api/alerts

[romhack-scanning]
search = index=romhack sourcetype=romhack:web status=404 | dedup event_id | stats count values(path) as paths by run_id src_ip | where count >= 5 | eval scenario="scanning", event_id=sha256(run_id.src_ip.scenario)
enableSched = 1
cron_schedule = * * * * *
dispatch.earliest_time = -3m
