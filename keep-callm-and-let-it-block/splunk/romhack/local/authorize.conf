# Read-only role used by the workshop's /api/search tool, so SPL written by an
# AI agent can only read the workshop index.
[role_romhack_analyst]
search = enabled
get_metadata = enabled
get_typeahead = enabled
list_inputs = disabled
schedule_search = disabled
edit_tcp = disabled
edit_httpauths = disabled
delete_by_keyword = disabled
rest_properties_get = disabled
srchIndexesAllowed = romhack
srchIndexesDefault = romhack
srchFilter = index=romhack
srchJobsQuota = 4
rtSrchJobsQuota = 0
srchDiskQuota = 100
